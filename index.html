<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EAS AI Product Sourcing</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f6fa;
margin:0;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
margin-bottom:5px;
}

.subtitle{
color:#666;
margin-bottom:25px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input{
width:100%;
padding:14px;
font-size:16px;
margin-top:10px;
margin-bottom:20px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
font-size:18px;
background:#0066ff;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#004fcc;
}

table{
width:100%;
margin-top:30px;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#0066ff;
color:white;
}

.good{
color:green;
font-weight:bold;
}

.bad{
color:red;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>🚀 EAS AI Product Sourcing</h1>

<div class="subtitle">
Costco → Coupang AI 분석
</div>

<div class="card">

<label><b>코스트코 상품 URL</b></label>

<input
id="url"
placeholder="https://www.costco.co.kr/...">

<button onclick="analyze()">
AI 분석 시작
</button>

</div>

<div id="result"></div>

</div>

<script>

function analyze(){

const url=document.getElementById("url").value;

if(url==""){
alert("상품 URL을 입력하세요.");
return;
}

document.getElementById("result").innerHTML=`

<table>

<tr>

<th>항목</th>

<th>결과</th>

</tr>

<tr>

<td>상품명</td>

<td>분석중...</td>

</tr>

<tr>

<td>코스트코 가격</td>

<td>분석중...</td>

</tr>

<tr>

<td>쿠팡 최저가</td>

<td>검색중...</td>

</tr>

<tr>

<td>예상 순이익</td>

<td>계산중...</td>

</tr>

<tr>

<td>ROI</td>

<td>계산중...</td>

</tr>

<tr>

<td>AI 추천</td>

<td class="good">분석 진행중</td>

</tr>

</table>

`;

setTimeout(()=>{

document.getElementById("result").innerHTML=`

<table>

<tr>

<th>항목</th>

<th>결과</th>

</tr>

<tr>

<td>상품명</td>

<td>Costco Product</td>

</tr>

<tr>

<td>코스트코 가격</td>

<td>19,990원</td>

</tr>

<tr>

<td>쿠팡 최저가</td>

<td>34,900원</td>

</tr>

<tr>

<td>예상 순이익</td>

<td>7,200원</td>

</tr>

<tr>

<td>ROI</td>

<td>36%</td>

</tr>

<tr>

<td>AI 추천</td>

<td class="good">★★★★★ 추천</td>

</tr>

</table>

`;

},1500);

}

</script>

</body>

</html>
