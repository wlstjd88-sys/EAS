<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EAS - Coupang Sourcing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f7fa;
      color: #111827;
    }

    h1 { margin-bottom: 4px; }

    .sub {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      font-size: 18px;
      line-height: 1.8;
    }

    .decision {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <h1>EAS</h1>
  <div class="sub">Costco → Coupang AI Sourcing Engine v0.1</div>

  <div class="card">
    <label>상품명</label>
    <input id="name" placeholder="예: 선크림 2개 세트">

    <label>코스트코 매입가 (원)</label>
    <input id="cost" type="number" placeholder="19990">

    <label>쿠팡 예상 판매가 (원)</label>
    <input id="sale" type="number" placeholder="34900">

    <label>쿠팡 판매수수료 (%)</label>
    <input id="fee" type="number" step="0.1" value="10.8">

    <label>배송비 (원)</label>
    <input id="shipping" type="number" value="3500">

    <label>포장비/기타비용 (원)</label>
    <input id="other" type="number" value="500">

    <button onclick="analyze()">AI 매입 분석</button>
  </div>

  <div class="card result" id="result">
    상품 정보를 입력하고 분석 버튼을 눌러주세요.
  </div>

<script>
function won(n) {
  return Math.round(n).toLocaleString("ko-KR") + "원";
}

function analyze() {
  const name = document.getElementById("name").value || "상품";
  const cost = Number(document.getElementById("cost").value);
  const sale = Number(document.getElementById("sale").value);
  const feeRate = Number(document.getElementById("fee").value) / 100;
  const shipping = Number(document.getElementById("shipping").value);
  const other = Number(document.getElementById("other").value);

  if (!cost || !sale) {
    alert("매입가와 예상 판매가를 입력해주세요.");
    return;
  }

  const coupangFee = sale * feeRate;
  const totalCost = cost + coupangFee + shipping + other;
  const netProfit = sale - totalCost;

  const margin = (netProfit / sale) * 100;
  const roi = (netProfit / cost) * 100;

  let decision = "비추천 ❌";
  let reason = "수익성이 낮습니다.";

  if (netProfit >= 5000 && margin >= 15 && roi >= 20) {
    decision = "매입추천 ✅";
    reason = "현재 기준으로 수익성이 양호합니다.";
  } else if (netProfit >= 2500 && margin >= 8) {
    decision = "보류 ⚠️";
    reason = "수익은 가능하지만 가격·경쟁 상황 추가 확인이 필요합니다.";
  }

  document.getElementById("result").innerHTML = `
    <div class="decision">${decision}</div>

    <strong>${name}</strong><br><br>

    매입가: ${won(cost)}<br>
    예상 판매가: ${won(sale)}<br>
    쿠팡 수수료: ${won(coupangFee)}<br>
    배송비: ${won(shipping)}<br>
    기타비용: ${won(other)}<br><br>

    <strong>예상 순이익: ${won(netProfit)}</strong><br>
    판매 마진율: ${margin.toFixed(1)}%<br>
    매입 ROI: ${roi.toFixed(1)}%<br><br>

    ${reason}
  `;
}
</script>

</body>
</html>
